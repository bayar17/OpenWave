<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.openwave.Permissions"/></policy>
  <policy context="default">
    <allow send_destination="org.openwave.Permissions" send_interface="org.openwave.Permissions1"/>
  </policy>
</busconfig>

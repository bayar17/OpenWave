<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.openwave.Time"/>
    <allow send_destination="org.openwave.Time"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.openwave.Time" send_interface="org.openwave.Time1" send_member="GetTimezone"/>
    <allow send_destination="org.openwave.Time" send_interface="org.openwave.Time1" send_member="ListTimezones"/>
  </policy>
</busconfig>

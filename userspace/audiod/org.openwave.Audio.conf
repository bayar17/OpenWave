<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.openwave.Audio"/>
    <allow send_destination="org.openwave.Audio"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.openwave.Audio" send_interface="org.openwave.Audio1" send_member="GetState"/>
    <allow send_destination="org.openwave.Audio" send_interface="org.openwave.Audio1" send_member="ListDevices"/>
  </policy>
</busconfig>

# Waydroid's upstream waydroid-net.sh creates and removes this bridge itself.
# Keep NetworkManager from claiming the bridge or racing its address setup.
# The container's host-side link (veth*) is a port of that bridge, attached
# by LXC: NetworkManager must not manage it either. Distributions ship a udev
# rule for this (85-nm-unmanaged.rules); this image has none.
[keyfile]
unmanaged-devices=interface-name:waydroid0;interface-name:veth*

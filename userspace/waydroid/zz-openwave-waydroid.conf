<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Loaded after upstream's compatibility policy. Native clients use appd;
       they must not supply container session paths or lifecycle operations. -->
  <policy context="default">
    <deny send_destination="id.waydro.Container"/>
  </policy>
  <policy user="root">
    <allow send_destination="id.waydro.Container"/>
  </policy>
  <policy user="waydroid">
    <allow send_destination="id.waydro.Container" send_type="method_call"
           send_interface="id.waydro.ContainerManager" send_member="Start"/>
    <allow send_destination="id.waydro.Container" send_type="method_call"
           send_interface="id.waydro.ContainerManager" send_member="Stop"/>
    <allow send_destination="id.waydro.Container" send_type="method_call"
           send_interface="id.waydro.ContainerManager" send_member="GetSession"/>
    <allow send_destination="id.waydro.Container" send_type="method_call"
           send_interface="id.waydro.ContainerManager" send_member="Freeze"/>
    <allow send_destination="id.waydro.Container" send_type="method_call"
           send_interface="id.waydro.ContainerManager" send_member="Unfreeze"/>
  </policy>
</busconfig>

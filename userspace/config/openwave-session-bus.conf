<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <servicedir>/usr/share/dbus-1/services</servicedir>
  <listen>unix:path=/run/ocean/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
    <deny own_prefix="org.openwave"/>
    <deny own="org.freedesktop.portal.Desktop"/>
    <deny own_prefix="org.freedesktop.impl.portal"/>
  </policy>
  <policy user="root">
    <allow own_prefix="org.openwave"/>
    <allow own="org.freedesktop.portal.Desktop"/>
    <allow own_prefix="org.freedesktop.impl.portal"/>
  </policy>
</busconfig>

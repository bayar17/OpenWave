# OpenWave runs one system-wide audio session without a desktop login manager.
# The BlueZ SPA backend and SBC codec are shipped with OpenWave.
wireplumber.profiles = {
  main-systemwide = {
    hardware.bluetooth = required
    monitor.bluez-midi = disabled
    hardware.video-capture = disabled
  }
}

# The current OpenWave build supports A2DP music playback with SBC.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.codecs = [ sbc ]
  bluez5.hfphsp-backend = "none"
}

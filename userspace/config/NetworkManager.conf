[main]
dhcp=internal
dns=default
# /etc/resolv.conf is a fixed link to NM's runtime DNS file. Keep /etc immutable.
rc-manager=unmanaged

[device]
wifi.backend=iwd
wifi.iwd.autoconnect=false

[keyfile]
# Persist profiles in the daemon's protected state, rather than installed /etc.
path=/var/lib/NetworkManager/system-connections

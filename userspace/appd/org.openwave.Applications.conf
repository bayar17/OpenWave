<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.openwave.Applications"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.openwave.Applications" send_interface="org.openwave.Applications1"/>
  </policy>
</busconfig>

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.openwave.Wallpaper"/>
    <allow send_destination="org.openwave.Wallpaper"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.openwave.Wallpaper" send_interface="org.openwave.Wallpaper1" send_member="GetCurrent"/>
    <allow send_destination="org.openwave.Wallpaper" send_interface="org.openwave.Wallpaper1" send_member="SetWallpaper"/>
  </policy>
</busconfig>

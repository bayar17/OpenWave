<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.openwave.Connectivity"/>
    <allow send_destination="org.openwave.Connectivity"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.openwave.Connectivity" send_interface="org.openwave.Connectivity1" send_member="GetState"/>
    <allow send_destination="org.openwave.Connectivity" send_interface="org.openwave.Connectivity1" send_member="ListWifiNetworks"/>
    <allow send_destination="org.openwave.Connectivity" send_interface="org.openwave.Connectivity1" send_member="ListBluetoothDevices"/>
  </policy>
</busconfig>

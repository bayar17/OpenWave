[binaries]
c = ['/mnt/aosp/ThunderOS/toolchain/bin/clang', '--target=x86_64-unknown-openwave', '--sysroot=/mnt/aosp/ThunderOS/toolchain/sysroot/x86_64-unknown-openwave']
cpp = ['/mnt/aosp/ThunderOS/toolchain/bin/clang++', '--target=x86_64-unknown-openwave', '--sysroot=/mnt/aosp/ThunderOS/toolchain/sysroot/x86_64-unknown-openwave']
ar = '/mnt/aosp/ThunderOS/toolchain/bin/llvm-ar'
strip = '/mnt/aosp/ThunderOS/toolchain/bin/llvm-strip'
nm = '/mnt/aosp/ThunderOS/toolchain/bin/llvm-nm'
objcopy = '/mnt/aosp/ThunderOS/toolchain/bin/llvm-objcopy'
readelf = '/mnt/aosp/ThunderOS/toolchain/bin/llvm-readelf'
ld = '/mnt/aosp/ThunderOS/toolchain/bin/ld.lld'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/mnt/aosp/ThunderOS/toolchain/sysroot/x86_64-unknown-openwave'
pkg_config_libdir = ['/mnt/aosp/ThunderOS/toolchain/sysroot/x86_64-unknown-openwave/usr/lib64/pkgconfig', '/mnt/aosp/ThunderOS/toolchain/sysroot/x86_64-unknown-openwave/usr/lib/pkgconfig', '/mnt/aosp/ThunderOS/toolchain/sysroot/x86_64-unknown-openwave/usr/share/pkgconfig']
needs_exe_wrapper = true
